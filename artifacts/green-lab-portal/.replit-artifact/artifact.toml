kind = "web"
previewPath = "/"
title = "Green Lab Client Portal"
version = "1.0.0"
id = "artifacts/green-lab-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22138

[services.development]
run = "pnpm --filter @workspace/green-lab-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/green-lab-portal", "run", "build" ]
publicDir = "artifacts/green-lab-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22138"
BASE_PATH = "/"
